{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "edge-processor.fullname" . }}-principal-job
  labels:
    {{- include "edge-processor.labels" . | nindent 4 }}
rules:
  # Allow creating the principal secret. RBAC `create` cannot be scoped
  # by resourceName because the resource does not yet exist at admission time.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  # Allow deleting only the principal secret managed by this job.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["delete"]
    resourceNames:
      - {{ include "edge-processor.secretName" . }}
  # Allow managing own pod information
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
{{- end }}